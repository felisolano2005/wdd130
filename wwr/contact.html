<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <meta name="description" content="This is the contact us page of the rafting website">
    <meta name="author" content="Felipe Solano">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body class="contact-page">
    <header>
        <img src="images/z-boat.png" alt="Company Logo">
        <nav>
            <ul>
                <li><a href="index.html" target="_blank">Home</a></li>
                <li><a href="about.html" target="_blank">About Us</a></li>
                <li><a href="trips.html" target="_blank">Trips</a></li>
                <li><a href="contact.html" target="_blank">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>Rapid Rush Adventures</h1>
        <p>Reventazon River, Turrialba</p>
        <p>San Jose, Costa Rica</p>
        <p>+506 6066-1771</p>
        <p>info@rapidrush.com</p>
        <div class="contact-grid">
            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d9348.13466267593!2d-83.65299220443839!3d9.900064603296537!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2scr!4v1771090402169!5m2!1sen!2scr"
                  width="600" height="450" allowfullscreen="" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
            <form action="#" method="post">
                <label for="name">Name:</label><br>
                <input type="text" id="name" name="name"><br><br>

                <label for="email">Email Address:</label><br>
                <input type="text" id="email" name="email"><br><br>

                <label>Purpose of Message:</label><br>

                <input type="radio" id="general" name="purpose" value="general">
                <label for="general">General Inquiry</label><br>

                <input type="radio" id="reservation" name="purpose" value="reservation">
                <label for="reservation">Reservation Question</label><br>

                <input type="radio" id="suggestion" name="purpose" value="suggestion">
                <label for="suggestion">Website Suggestion</label><br><br>

                <label for="message">Message:</label><br>
                <textarea id="message" name="message" rows="5" cols="40"></textarea><br><br>

                <input type="checkbox" id="newsletter" name="newsletter">
                <label for="newsletter">Please subscribe me to the monthly
                    newsletter</label><br><br>

                <input type="checkbox" id="newsletter" name="newsletter">
                <label for="newsletter">Please subscribe me to the monthly
                    newsletter</label><br><br>

                <button type="submit">Get in touch!</button>

            </form>
        </div>
        <section class="employee-section">
            <h2>We Are Here to Serve You</h2>
            <div class="employee-gallery">
                <figure>
                    <img src="images/raft_staff.jpg" alt="Employee #1">
                    <figcaption>Martha Anderson</figcaption>
                </figure>
                <figure>
                    <img src="images/employment3.jpg" alt="Employee #2">
                    <figcaption>Ashley Chavarria</figcaption>
                </figure>
                <figure>
                    <img src="images/lightroomed.jpg" alt="Employee #3">
                    <figcaption>Pedro Sanchez</figcaption>
                </figure>
            </div>
        </section>
    </main>
    <footer>
        <p> &copy; 2026 Rapid Rush Adventures Felipe Solano</p>
        <nav class="socialmedia">
            <a href="https://www.facebook.com/">
                <img src="images/facebook_174848.png" alt="Facebook Icon" width="100">
            </a>
            <a href="https://www.linkedin.com/">
                <img src="images/linkedin_3991775.png" alt="LinkedIn Icon" width="100">
            </a>
            <a href="https://www.instagram.com/">
                <img src="images/instagram_174855.png" alt="Instagram Icon" width="100">
            </a>
        </nav>
    </footer>
</body>

</html>
