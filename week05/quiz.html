<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic HTML and CSS Quiz</title>
    <link rel="stylesheet" href="../styles/quiz.css">
</head>

<body>

    <main>
        <h1>☑ Basic HTML and CSS Quiz</h1>

        <form action="#" method="post">

            <!-- Question 1 -->
            <div class="form-group">
                <label for="q1">
                    <span>1.</span> What does the acronym CSS stand for?
                </label>
                <input type="text" id="q1" name="q1" required>
            </div>

            <!-- Question 2 -->
            <div class="form-group">
                <label for="q2">
                    <span>2.</span> How are id and class attributes selected in CSS?
                </label>
                <textarea id="q2" name="q2" rows="5" required></textarea>
            </div>

            <!-- Question 3 -->
            <div class="form-group">
                <label for="q3">
                    <span>3.</span> Which of the following is a valid CSS comment?
                </label>
                <select id="q3" name="q3" required>
                    <option value="" selected disabled>Choose One ...</option>
                    <option value="// comment">// comment</option>
                    <option value="<!-- comment -->">&lt;!-- comment --&gt;</option>
                    <option value="/* comment */">/* comment */</option>
                </select>
            </div>

            <!-- Question 4 -->
            <div class="form-group">
                <label for="q4">
                    <span>4.</span> What is the bottom margin given this declaration?
                </label>

                <div class="code-box">
                    margin: 10px 5px 15px;
                </div>

                <input type="number" id="q4" name="q4" required>
            </div>

            <button type="submit">Submit Quiz</button>

        </form>
    </main>

</body>

</html>
